apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-svc
  labels:
    app: analytics-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: analytics-svc
    spec:
      containers:
        - name: analytics-svc
          image: analytics-svc:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: LOG_LEVEL
              value: "info"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-svc-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: analytics-svc-secrets
                  key: SUPABASE_ANON_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4001
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
