# Template only — never commit real values. Create the actual secret with:
#
#   kubectl create secret generic roster-svc-secrets \
#     --from-literal=SUPABASE_URL='https://<project-id>.supabase.co' \
#     --from-literal=SUPABASE_ANON_KEY='<anon-key>'
#
# Same values as NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY in
# the monolith's env — anon key only, RLS does the gatekeeping.
apiVersion: v1
kind: Secret
metadata:
  name: roster-svc-secrets
type: Opaque
stringData:
  SUPABASE_URL: "REPLACE_ME"
  SUPABASE_ANON_KEY: "REPLACE_ME"
