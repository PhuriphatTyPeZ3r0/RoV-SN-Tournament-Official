# Separate from k8s/shared/ingress.yaml deliberately: that one carries
# nginx.ingress.kubernetes.io/rewrite-target: /$2, which only makes sense
# for its capture-group /api/* paths. The frontend needs the original path
# untouched (e.g. /standings must reach Next.js as /standings, not /),
# so it gets its own Ingress with no rewrite annotation. nginx-ingress
# merges rules from multiple Ingress resources for the same host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rov-sn-frontend-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
